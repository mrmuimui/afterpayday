<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- connect-src includes the Smart Scan proxy and Supabase cloud sync.
         http://localhost:8787 is the local `wrangler dev` worker; replace the
         workers.dev placeholder with YOUR deployed proxy origin (see
         worker/README.md). Replace YOUR-PROJECT-REF with your Supabase
         project ref (see supabase/README.md). Both are optional — if unused,
         these extra origins are simply never contacted. Realtime isn't used,
         so no wss:// entry is needed. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' http://localhost:8787 https://afterpayday-receipt-proxy.YOUR-SUBDOMAIN.workers.dev https://YOUR-PROJECT-REF.supabase.co" />
    <title>AfterPayday</title>

    <!-- PWA -->
    <meta name="theme-color" content="#10b981" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AfterPayday" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Pre-paint dark background so body matches splash + app bg before JS/CSS loads -->
    <style>html,body,#root{background:#06040e;min-height:100vh}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
